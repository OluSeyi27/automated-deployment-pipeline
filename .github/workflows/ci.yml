
name: Cloud Pipeline CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Application Tests
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run automated tests
        run: npm test
