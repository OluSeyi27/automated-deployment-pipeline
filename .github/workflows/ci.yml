
name: Cloud Pipeline CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Application Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Get repository code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Run automated tests
        run: npm test
